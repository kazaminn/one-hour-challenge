name: Build & Deploy

# main への push と、Actions 画面からの手動実行（Run workflow）で動く。
# Vercel 公式ガイドと同じく、build と deploy を1つのジョブで順に行う。
# build が失敗したら、そこでジョブが止まり deploy はされない。
# https://vercel.com/kb/guide/how-can-i-use-github-actions-with-vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に2本走らせない。後から来た方は前の完了を待つ。
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # build の成果物は node_modules 内のファイルを参照するので、同じマシンに入れておく
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        # 公開直後のパッケージは npm から取れず 404 になることがあるので、1時間以内に出た版は避ける
        run: npm install --global vercel@latest --before="$(date -u -d '-1 hour' +%FT%TZ)"

      # 本番の環境変数（Turso の接続情報など）とプロジェクト設定を取ってくる
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
